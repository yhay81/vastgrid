[project]
name = "vastgrid"
version = "0.0.0"
description = "Huge tables in a notebook as a grid you can edit: DuckDB in the kernel reads DataFrames, Arrow tables, DuckDB relations and CSV, Parquet, JSON Lines and Excel files, and vastgrid's grid sorts, filters, groups, edits and exports them."
readme = "README.md"
license = "MIT"
authors = [{ name = "yhay81" }]
requires-python = ">=3.11"
keywords = ["data grid", "duckdb", "jupyter", "anywidget", "csv", "parquet", "excel"]
classifiers = [
  "Framework :: Jupyter",
  "Framework :: Jupyter :: JupyterLab",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["anywidget>=0.10", "duckdb>=2.0.0", "pyarrow>=19"]

[project.urls]
Homepage = "https://vastgrid.yhay81.com"
Repository = "https://github.com/yhay81/vastgrid"
Issues = "https://github.com/yhay81/vastgrid/issues"

[dependency-groups]
dev = ["pytest==9.1.1", "pandas==3.1.0", "polars==2.1.0", "ruff==0.17.3", "jupyterlab==4.6.4", "notebook==7.6.3"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vastgrid"]
artifacts = ["src/vastgrid/static/*"]

[tool.uv]
python-preference = "managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
