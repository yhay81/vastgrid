version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait two weeks after a release, as CONTRIBUTING.md asks, so that a compromised version is likely found first.
    cooldown:
      default-days: 14
    ignore:
      # The workspace packages themselves.
      - dependency-name: "vastgrid*"
      # The types follow the Node.js version in .nvmrc.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The types follow engines.vscode in packages/vscode/package.json: vsce refuses newer ones.
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # React Compiler (babel-plugin-react-compiler) works on Babel 7's syntax tree: with Babel 8 it gives up on
      # components whose props have defaults, which fails the build (v2-react.md §11). ESLint 10 needs
      # @babel/eslint-parser 8, which needs Babel 8. Both wait for a React Compiler that supports Babel 8.
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
