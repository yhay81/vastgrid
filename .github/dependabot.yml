version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release, so that a compromised version is likely found before it gets here.
    cooldown:
      default-days: 7
    ignore:
      # The workspace packages themselves.
      - dependency-name: "vastgrid*"
      # The types follow the Node.js version in .nvmrc.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The types follow engines.vscode in packages/vscode/package.json: vsce refuses newer ones.
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
