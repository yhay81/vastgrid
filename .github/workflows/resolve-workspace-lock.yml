name: Resolve the workspace lockfile
on: pull_request
permissions:
  contents: read
jobs:
  resolve:
    if: github.head_ref == 'dependabot/npm_and_yarn/vite-plus-1.7.0'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Resolve with the project's package manager
        run: |
          manager=$(node -p 'require("./package.json").packageManager')
          npm exec --yes --package="$manager" -- pnpm install --ignore-scripts --lockfile-only --no-frozen-lockfile
          git hash-object pnpm-lock.yaml | sed 's/^/LOCKHASH /'
          base64 -w 240 pnpm-lock.yaml | sed 's/^/LOCKDATA /'
