name: Release
# A tag v<version> releases every package at that version: the npm packages, the Python package on PyPI and, for
# versions that are not pre-releases, the VS Code extension on the Marketplace. See "Releasing" in CONTRIBUTING.md.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release
jobs:
  # Checks and packs without the right to publish, so that no dependency run here can publish.
  build:
    name: Check and pack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # No cache: what is published is built from the lockfiles alone.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@v10.3.2
      - run: node scripts/release.mjs check "${GITHUB_REF_NAME#v}"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Python's widget imports these generated assets, including in the tests run by `npm test`.
      - run: npm run build
      - run: npm test
      - run: npm run test:performance
      - run: npm run size
      - name: Pack the npm packages
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          npm pack -w packages/spec -w packages/sql -w packages/js -w packages/grid -w packages/duckdb-engine \
            -w packages/cli -w packages/mcp --pack-destination "$RUNNER_TEMP/packages"
      # The examples of the READMEs, run from the tarballs that are published.
      - run: node scripts/pack-check.mjs "$RUNNER_TEMP/packages"
      # The notebook's package carries the grid's module that `npm run build` wrote (static/widget.js).
      - name: Build the Python package
        working-directory: packages/notebook/python
        run: |
          uv run --frozen ruff check
          uv run --frozen pytest
          uv build --out-dir "$RUNNER_TEMP/python"
      # One package of the extension for each platform, with DuckDB's bindings of that platform.
      - name: Package the VS Code extension
        run: |
          for target in linux-x64 linux-arm64 alpine-x64 darwin-x64 darwin-arm64 win32-x64 win32-arm64; do
            npm run package -w vastgrid-vscode -- "$target"
          done
          mkdir -p "$RUNNER_TEMP/vscode"
          cp packages/vscode/dist/*.vsix "$RUNNER_TEMP/vscode"
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: ${{ runner.temp }}/packages
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: python
          path: ${{ runner.temp }}/python
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: vscode
          path: ${{ runner.temp }}/vscode
          if-no-files-found: error
  npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # npm accepts these packages only from this workflow in this environment; the environment's settings decide
    # which tags may use it.
    environment: npm
    permissions:
      # Trusted publishing and provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Trusted publishing needs npm 11.5.1 or later, which Node.js 24 includes.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: ${{ runner.temp }}/packages
      # Each package after those it depends on. Versions already on npm are skipped, so that a failed run can be run
      # again.
      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          tag=latest
          if [[ "$version" == *-* ]]; then tag=next; fi
          for name in vastgrid-spec vastgrid-sql vastgrid-js vastgrid vastgrid-duckdb vastgrid-cli vastgrid-mcp; do
            if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "$name@$version is already on npm."
            else
              npm publish "$RUNNER_TEMP/packages/$name-$version.tgz" --provenance --access public --tag "$tag"
            fi
          done
  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # PyPI accepts the package only from this workflow in this environment (a trusted publisher).
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v10.3.2
      - uses: actions/download-artifact@v8
        with:
          name: python
          path: ${{ runner.temp }}/python
      # Files already on PyPI are skipped, so that a failed run can be run again.
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ "$RUNNER_TEMP"/python/*
  vscode:
    name: Publish to the VS Code Marketplace
    needs: build
    # The Marketplace takes only major.minor.patch: pre-releases are on the GitHub release only.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: vscode
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          name: vscode
          path: ${{ runner.temp }}/vscode
      - name: Publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npm ci --ignore-scripts
          for package in "$RUNNER_TEMP"/vscode/*.vsix; do
            npx vsce publish --skip-duplicate --packagePath "$package"
          done
  release:
    name: Create the GitHub release
    needs: [npm, pypi, vscode]
    # Stable releases are complete only after all three registries accept their packages. Pre-releases skip VS Code.
    if: ${{ always() && needs.npm.result == 'success' && needs.pypi.result == 'success' && (needs.vscode.result == 'success' || needs.vscode.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/assets
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then exit 0; fi
          node scripts/release.mjs notes "$version" > "$RUNNER_TEMP/notes.md"
          options=()
          if [[ "$version" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "vastgrid $version" \
            --notes-file "$RUNNER_TEMP/notes.md" "${options[@]}" \
            "$RUNNER_TEMP"/assets/vscode/*.vsix "$RUNNER_TEMP"/assets/python/*
