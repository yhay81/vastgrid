name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Each job sets up Vite+, the Node.js of .node-version (or of the matrix) and the pnpm of packageManager, and installs
# the workspace from pnpm-lock.yaml.
jobs:
  check:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run size
      # The packages installed from their tarballs in a new project, as users install them.
      - run: pnpm run pack-check
  test:
    name: Test (${{ matrix.os }}, Node.js ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # From the oldest version in "engines" to the newest release.
        node: [22, 24, 26]
        include:
          # DuckDB is a native module, and file access depends on the platform's paths and links.
          - os: macos-latest
            node: 26
          - os: windows-latest
            node: 26
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: ${{ matrix.node }}
          cache: true
      - run: pnpm test
  notebook:
    name: Test the notebook's package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      # The Python package and its tests; the TypeScript tests of packages/notebook run it with uv.
      - uses: astral-sh/setup-uv@v10.3.3
      # The grid's module that the package carries (static/widget.js).
      - run: pnpm run build
      - run: uv run --frozen ruff check && uv run --frozen ruff format --check && uv run --frozen pytest
        working-directory: packages/notebook/python
      - run: pnpm test packages/notebook/test
  e2e:
    name: Functional end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - run: pnpm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: functional-e2e-failure
          path: test-results/
          retention-days: 7
  performance:
    name: Isolated performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      # One file at a time, before any build or browser runs on this runner.
      - run: pnpm run test:performance
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - run: pnpm run e2e:performance
  e2e-large:
    name: Large-file end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - run: pnpm run e2e:large
  vscode:
    name: VS Code extension (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - run: pnpm run build
      - run: pnpm --filter vastgrid-vscode run package ${{ matrix.target }}
      # The package, installed in a stable VS Code (in a virtual display on Linux): open, edit, save, read-only
      # formats, sheets and the last rows of large files (docs/vscode.md).
      - name: Test the package in VS Code
        shell: bash
        run: |
          version=$(node -p "require('./packages/vscode/package.json').version")
          export VASTGRID_VSIX="dist/vastgrid-vscode-$version-${{ matrix.target }}.vsix"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a pnpm --filter vastgrid-vscode run test:vscode
          else
            pnpm --filter vastgrid-vscode run test:vscode
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: vastgrid-vscode-${{ matrix.target }}
          path: packages/vscode/dist/*.vsix
          if-no-files-found: error
