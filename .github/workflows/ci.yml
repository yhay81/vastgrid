name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run size
  test:
    name: Test (${{ matrix.os }}, Node.js ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # From the oldest version in "engines" to the newest release.
        node: [20, 22, 24, 26]
        include:
          # DuckDB is a native module, and file access depends on the platform's paths and links.
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
  react-18:
    name: Test with React 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The oldest React that v1's peerDependencies allow; v2 (packages/grid) needs React 19.3.
      - run: npm install --no-save --legacy-peer-deps react@18 react-dom@18 @types/react@18 @types/react-dom@18
      - run: npx tsc -b packages/core packages/duckdb packages/react
      - run: >-
          node --conditions=vastgrid-source --import tsx --test packages/core/test/*.test.ts
          packages/duckdb/test/*.test.ts packages/browser/test/*.test.ts packages/react/test/*.test.ts
  e2e:
    name: End-to-end tests and performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
  vscode:
    name: VS Code extension (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package -w vastgrid-vscode -- ${{ matrix.target }}
      # The package, installed in a stable VS Code (in a virtual display on Linux): open, edit, save, read-only
      # formats, sheets and the last rows of large files (docs/vscode.md).
      - name: Test the package in VS Code
        shell: bash
        run: |
          version=$(node -p "require('./packages/vscode/package.json').version")
          export VASTGRID_VSIX="dist/vastgrid-vscode-$version-${{ matrix.target }}.vsix"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a npm run test:vscode -w vastgrid-vscode
          else
            npm run test:vscode -w vastgrid-vscode
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vastgrid-vscode-${{ matrix.target }}
          path: packages/vscode/dist/*.vsix
          if-no-files-found: error
