name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run size
      # The packages installed from their tarballs in a new project, as users install them.
      - run: npm run pack-check
  test:
    name: Test (${{ matrix.os }}, Node.js ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # From the oldest version in "engines" to the newest release.
        node: [20, 22, 24, 26]
        include:
          # DuckDB is a native module, and file access depends on the platform's paths and links.
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
  notebook:
    name: Test the notebook's package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # The Python package and its tests; the TypeScript tests of packages/notebook run it with uv.
      - uses: astral-sh/setup-uv@v10.3.0
      - run: npm ci
      # The grid's module that the package carries (static/widget.js).
      - run: npm run build
      - run: uv run --frozen ruff check && uv run --frozen ruff format --check && uv run --frozen pytest
        working-directory: packages/notebook/python
      - run: node --conditions=vastgrid-source --import tsx --test packages/notebook/test/*.test.ts
  e2e:
    name: End-to-end tests and performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
  vscode:
    name: VS Code extension (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package -w vastgrid-vscode -- ${{ matrix.target }}
      # The package, installed in a stable VS Code (in a virtual display on Linux): open, edit, save, read-only
      # formats, sheets and the last rows of large files (docs/vscode.md).
      - name: Test the package in VS Code
        shell: bash
        run: |
          version=$(node -p "require('./packages/vscode/package.json').version")
          export VASTGRID_VSIX="dist/vastgrid-vscode-$version-${{ matrix.target }}.vsix"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a npm run test:vscode -w vastgrid-vscode
          else
            npm run test:vscode -w vastgrid-vscode
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vastgrid-vscode-${{ matrix.target }}
          path: packages/vscode/dist/*.vsix
          if-no-files-found: error
